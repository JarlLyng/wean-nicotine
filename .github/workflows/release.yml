# GitHub Release for every version tag (#104)
#
# Push an annotated tag `vX.Y.Z` at the release commit and this publishes a
# GitHub Release whose notes are that version's CHANGELOG.md section. The
# tag must exist in CHANGELOG.md first; the job fails rather than publish an
# empty release.
#
# Run it by hand with an existing tag to backfill a release that predates
# this workflow. Backfilled releases are not marked Latest.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v1.6.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      # Notes come from the default branch, not the tagged commit: a version's
      # changelog section is edited after the tag (submitted, then approved
      # and live), and the release should carry the current text.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          tag="$REF_NAME"
          latest=true
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            latest=false
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a vX.Y.Z tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Notes from CHANGELOG.md
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/changelog-section.mjs "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          LATEST: ${{ steps.tag.outputs.latest }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it as it is."
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest="$LATEST"
